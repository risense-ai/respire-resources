openapi: 3.1.0
info:
  title: Respire Runtime Local API
  version: 1.0.0-draft
  summary: Canonical REST + SSE contract for respire-runtime, respire-cli, respire-client2, and plugins.
  description: |
    Canonical OpenAPI 3.1 contract for Respire Runtime (see openspec/changes/002-runtime-openapi-v1-migration).
    All clients and plugins MUST negotiate features via /v1/health capabilities rather than comparing version strings.
    Health discovery does not require credentials. Send the discovered Runtime-local Bearer token for protected operations.
    Existing operation security annotations remain unchanged for compatibility; new backup operations declare localBearer.
    The legacy JSON-RPC authentication and wire format are outside this contract and are unchanged.
servers:
  - url: http://127.0.0.1:{port}
    description: Local Loopback Runtime Server
    variables:
      port:
        default: "3930"
tags:
  - name: health
    description: Health check, capability negotiation, and lightweight status
  - name: memories
    description: Memory CRUD and semantic recall
  - name: diary
    description: Daily diary entries and timeline
  - name: organize
    description: Tree organization (deepen plan/apply, split, suggestions)
  - name: models
    description: Model catalog, active assets, switch, and managed downloads
  - name: operations
    description: Asynchronous long-running operations and SSE streams
  - name: spaces
    description: Multi-space management and membership
  - name: sync
    description: Cloud/device synchronization status and triggers
  - name: backup
    description: Capability-gated backup archive export and restoration
  - name: host
    description: Account, authentication transactions, and device config

paths:
  /v1/health:
    get:
      operationId: getHealth
      tags: [health]
      summary: Query runtime health, identity, and supported capabilities
      responses:
        "200":
          description: Runtime health and capability flags
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          description: Runtime unavailable or initializing
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        default:
          $ref: "#/components/responses/RuntimeProblem"

  /v1/status/light:
    get:
      operationId: getLightStatus
      tags: [health]
      summary: SQL-aggregated lightweight counts and timestamps (never loads full store)
      parameters:
        - name: space_id
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Lightweight aggregated status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LightStatusResponse"
        default:
          $ref: "#/components/responses/RuntimeProblem"

  /v1/memories:
    get:
      operationId: listMemories
      tags: [memories]
      summary: List or paginate memories in active space
      parameters:
        - name: space_id
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: cursor
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Memory page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemoryListResponse"
        "400":
          description: Invalid query parameters
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        default:
          $ref: "#/components/responses/RuntimeProblem"

    post:
      operationId: createMemory
      tags: [memories]
      summary: Store a memory entry via JSON body (zero CLI length limits)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMemoryRequest"
      responses:
        "201":
          description: Memory created or updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemoryItem"
        "400":
          description: Validation error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        default:
          $ref: "#/components/responses/RuntimeProblem"

  /v1/memories/{memoryId}:
    parameters:
      - name: memoryId
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getMemory
      tags: [memories]
      summary: Get a memory by ID
      responses:
        "200":
          description: Memory detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemoryItem"
        "404":
          description: Memory not found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        default:
          $ref: "#/components/responses/RuntimeProblem"

    patch:
      operationId: updateMemory
      tags: [memories]
      summary: Update a memory entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMemoryRequest"
      responses:
        "200":
          description: Updated memory
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemoryItem"
        "404":
          description: Memory not found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        default:
          $ref: "#/components/responses/RuntimeProblem"

    delete:
      operationId: deleteMemory
      tags: [memories]
      summary: Soft-delete a memory entry
      responses:
        "204":
          description: Memory deleted
        "404":
          description: Memory not found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        default:
          $ref: "#/components/responses/RuntimeProblem"

  /v1/memories/recall:
    post:
      operationId: recallMemories
      tags: [memories]
      summary: Run hybrid memory recall
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecallRequest"
      responses:
        "200":
          description: Ranked recall hits
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecallResponse"
        "400":
          description: Invalid recall request
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        default:
          $ref: "#/components/responses/RuntimeProblem"

  /v1/diary:
    get:
      operationId: listDiaryEntries
      tags: [diary]
      summary: List diary entries by date range
      parameters:
        - name: space_id
          in: query
          schema:
            type: string
        - name: date
          in: query
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Diary entries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiaryListResponse"
        default:
          $ref: "#/components/responses/RuntimeProblem"

    post:
      operationId: upsertDiaryEntry
      tags: [diary]
      summary: Create or append a diary entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertDiaryRequest"
      responses:
        "200":
          description: Saved diary entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiaryEntry"
        default:
          $ref: "#/components/responses/RuntimeProblem"

  /v1/organize/deepen/plan:
    post:
      operationId: planOrganizeDeepen
      tags: [organize]
      summary: Compute tree deepen clustering plan via Core ABI
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrganizeDeepenPlanRequest"
      responses:
        "200":
          description: Proposed tree deepen plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizeDeepenPlanResponse"
        default:
          $ref: "#/components/responses/RuntimeProblem"

  /v1/organize/deepen/apply:
    post:
      operationId: applyOrganizeDeepen
      tags: [organize]
      summary: Apply a confirmed tree deepen plan and enqueue sync
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrganizeDeepenApplyRequest"
      responses:
        "202":
          description: Deepen apply operation accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationAccepted"
        default:
          $ref: "#/components/responses/RuntimeProblem"

  /v1/organize/split:
    post:
      operationId: splitOrganizeNode
      tags: [organize]
      summary: Split an oversized memory tree node
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrganizeSplitRequest"
      responses:
        "202":
          description: Split operation accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationAccepted"
        default:
          $ref: "#/components/responses/RuntimeProblem"

  /v1/organize/suggestions:
    get:
      operationId: getOrganizeSuggestions
      tags: [organize]
      summary: Fetch on-demand tree cure / organize suggestions (never polled blindly)
      parameters:
        - name: space_id
          in: query
          schema:
            type: string
        - name: top
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: Organization suggestions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizeSuggestionsResponse"
        default:
          $ref: "#/components/responses/RuntimeProblem"

  /v1/models/catalog:
    get:
      operationId: getModelCatalog
      tags: [models]
      summary: Get authoritative model catalog and hardware engine availability matrix
      responses:
        "200":
          description: Model catalog and engine availability
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelCatalogResponse"
        default:
          $ref: "#/components/responses/RuntimeProblem"

  /v1/models/active-assets:
    get:
      operationId: getActiveModelAssets
      tags: [models]
      summary: Inspect currently loaded model ID and locked filesystem paths (read-only)
      responses:
        "200":
          description: Active model asset paths
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActiveModelAssetsResponse"
        default:
          $ref: "#/components/responses/RuntimeProblem"

  /v1/models/switch:
    post:
      operationId: switchModel
      tags: [models]
      summary: Start non-blocking model switch / index rebuild operation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SwitchModelRequest"
      responses:
        "202":
          description: Switch operation accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationAccepted"
        "400":
          description: Invalid model or unavailable engine
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        default:
          $ref: "#/components/responses/RuntimeProblem"

  /v1/models/downloads:
    post:
      operationId: startModelDownload
      tags: [models]
      summary: Start Runtime-managed streaming model download without stopping Runtime
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DownloadModelRequest"
      responses:
        "202":
          description: Download operation accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationAccepted"
        "409":
          description: Conflicting operation in progress
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        default:
          $ref: "#/components/responses/RuntimeProblem"

  /v1/operations/{operationId}:
    parameters:
      - name: operationId
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getOperation
      tags: [operations]
      summary: Get current snapshot of an asynchronous operation
      responses:
        "200":
          description: Operation status snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationStatus"
        "404":
          description: Operation not found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        default:
          $ref: "#/components/responses/RuntimeProblem"

    delete:
      operationId: cancelOperation
      tags: [operations]
      summary: Request cooperative cancellation of a running operation
      responses:
        "202":
          description: Cancellation acknowledged
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationStatus"
        "404":
          description: Operation not found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        default:
          $ref: "#/components/responses/RuntimeProblem"

  /v1/operations/{operationId}/events:
    parameters:
      - name: operationId
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: streamOperationEvents
      tags: [operations]
      summary: Stream progress and completion events over Server-Sent Events (SSE)
      responses:
        "200":
          description: SSE stream emitting progress, completed, failed, or cancelled events
          content:
            text/event-stream:
              schema:
                $ref: "#/components/schemas/OperationEvent"
        default:
          $ref: "#/components/responses/RuntimeProblem"

  /v1/spaces:
    get:
      operationId: listSpaces
      tags: [spaces]
      summary: List available memory spaces
      responses:
        "200":
          description: Space list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpaceListResponse"
        default:
          $ref: "#/components/responses/RuntimeProblem"

    post:
      operationId: createSpace
      tags: [spaces]
      summary: Create a new memory space
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSpaceRequest"
      responses:
        "201":
          description: Created space
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpaceItem"
        default:
          $ref: "#/components/responses/RuntimeProblem"

  /v1/spaces/{spaceId}:
    parameters:
      - name: spaceId
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getSpace
      tags: [spaces]
      summary: Get space details
      responses:
        "200":
          description: Space details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpaceItem"
        "404":
          description: Space not found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        default:
          $ref: "#/components/responses/RuntimeProblem"

    patch:
      operationId: updateSpace
      tags: [spaces]
      summary: Update space metadata or active state
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSpaceRequest"
      responses:
        "200":
          description: Updated space
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpaceItem"
        default:
          $ref: "#/components/responses/RuntimeProblem"

    delete:
      operationId: deleteSpace
      tags: [spaces]
      summary: Delete a space
      responses:
        "204":
          description: Space deleted
        "404":
          description: Space not found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        default:
          $ref: "#/components/responses/RuntimeProblem"

  /v1/spaces/{spaceId}/members:
    parameters:
      - name: spaceId
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: listSpaceMembers
      tags: [spaces]
      summary: List members and grants for a shared space
      responses:
        "200":
          description: Space members
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpaceMemberListResponse"
        default:
          $ref: "#/components/responses/RuntimeProblem"

    post:
      operationId: inviteSpaceMember
      tags: [spaces]
      summary: Add or invite a member to a space
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InviteSpaceMemberRequest"
      responses:
        "201":
          description: Member added or invited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpaceMember"
        default:
          $ref: "#/components/responses/RuntimeProblem"

  /v1/sync/status:
    get:
      operationId: getSyncStatus
      tags: [sync]
      summary: Query synchronization state and pending outbox count
      responses:
        "200":
          description: Sync status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncStatusResponse"
        default:
          $ref: "#/components/responses/RuntimeProblem"

  /v1/sync/trigger:
    post:
      operationId: triggerSync
      tags: [sync]
      summary: Enqueue an asynchronous sync cycle
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TriggerSyncRequest"
      responses:
        "202":
          description: Sync operation accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationAccepted"
        default:
          $ref: "#/components/responses/RuntimeProblem"

  /v1/host/account:
    get:
      operationId: getHostAccount
      tags: [host]
      summary: Get current account, device binding, and auth transaction state
      responses:
        "200":
          description: Account status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HostAccountResponse"
        default:
          $ref: "#/components/responses/RuntimeProblem"

  /v1/host/transactions/login:
    post:
      operationId: executeLoginTransaction
      tags: [host]
      summary: Execute Runtime-owned account login / recovery transaction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginTransactionRequest"
      responses:
        "200":
          description: Transaction step or completion result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HostTransactionResult"
        "400":
          description: Invalid login payload
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        default:
          $ref: "#/components/responses/RuntimeProblem"

  /v1/host/transactions/logout:
    post:
      operationId: executeLogoutTransaction
      tags: [host]
      summary: Execute Runtime-owned logout transaction without leaving orphaned host state
      responses:
        "200":
          description: Logout completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HostTransactionResult"
        default:
          $ref: "#/components/responses/RuntimeProblem"

  /v1/host/config:
    get:
      operationId: getHostConfig
      tags: [host]
      summary: Get Runtime-authoritative host/agent/model-mirror configuration
      responses:
        "200":
          description: Current configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HostConfig"
        default:
          $ref: "#/components/responses/RuntimeProblem"

    patch:
      operationId: patchHostConfig
      tags: [host]
      summary: Atomically update configuration without stopping Runtime
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchHostConfigRequest"
      responses:
        "200":
          description: Updated configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HostConfig"
        default:
          $ref: "#/components/responses/RuntimeProblem"

  /v1/backups/export:
    get:
      operationId: exportBackup
      tags: [backup]
      summary: Stream a backup archive for the selected space
      description: Available only when health advertises backups.v1. Never accepts a Runtime filesystem path.
      security:
        - localBearer: []
      parameters:
        - name: space_id
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Opaque backup archive. Clients must not assume its internal format.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/LocalBearerUnauthorized"
        default:
          $ref: "#/components/responses/RuntimeProblem"

  /v1/backups/import:
    post:
      operationId: importBackup
      tags: [backup]
      summary: Upload a backup archive for asynchronous restoration
      description: Available only when health advertises backups.v1. Send archive bytes, not a local path.
      security:
        - localBearer: []
      parameters:
        - name: space_id
          in: query
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "202":
          description: Archive accepted for validation and restoration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationAccepted"
        "401":
          $ref: "#/components/responses/LocalBearerUnauthorized"
        default:
          $ref: "#/components/responses/RuntimeProblem"

components:
  securitySchemes:
    localBearer:
      type: http
      scheme: bearer
      description: Opaque Runtime-local access token obtained through local discovery. Not an account or upstream token.
  responses:
    RuntimeProblem:
      description: Unsuccessful Runtime request
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    LocalBearerUnauthorized:
      description: Missing or invalid Runtime-local access token
      headers:
        WWW-Authenticate:
          description: Bearer authentication challenge
          schema:
            type: string
          example: Bearer
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
  schemas:
    ProblemDetails:
      description: RFC 9457 problem document. Consumers must handle unfamiliar code values.
      type: object
      required: [type, title, status, detail, code]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        code:
          type: string
          description: |
            Stable machine-readable error code; not a closed set.
            Model download failures after exhausting permitted fallback sources use
            model_mirror_fallback_exhausted. Do not expose source credentials or signed URLs.
        instance:
          type: string
        retryable:
          type: boolean
          default: false

    HealthResponse:
      type: object
      required: [status, instance_id, capabilities]
      properties:
        status:
          type: string
          enum: [ready, starting, degraded]
        instance_id:
          type: string
        pid:
          type: integer
        active_space_id:
          type: string
        capabilities:
          type: array
          items:
            type: string
          description: Feature flags such as openapi.v1, sse.operations.v1, model.catalog.v2, model.active_assets, model.managed_download, host.transactions.v1

    LightStatusResponse:
      type: object
      required: [space_id, memory_count, diary_count, indexed_count]
      properties:
        space_id:
          type: string
        memory_count:
          type: integer
        diary_count:
          type: integer
        indexed_count:
          type: integer
        last_updated_at:
          type: [string, "null"]
          format: date-time

    CreateMemoryRequest:
      type: object
      required: [content]
      properties:
        space_id:
          type: string
        title:
          type: string
        content:
          type: string
        parent_id:
          type: [string, "null"]
        category:
          type: string
        tags:
          type: array
          items:
            type: string

    UpdateMemoryRequest:
      type: object
      properties:
        title:
          type: string
        content:
          type: string
        tags:
          type: array
          items:
            type: string

    MemoryItem:
      type: object
      required: [id, content, created_at, updated_at]
      properties:
        id:
          type: string
        space_id:
          type: string
        title:
          type: string
        content:
          type: string
        parent_id:
          type: [string, "null"]
        category:
          type: string
        tags:
          type: array
          items:
            type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    MemoryListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/MemoryItem"
        next_cursor:
          type: [string, "null"]

    RecallRequest:
      type: object
      required: [query]
      properties:
        query:
          type: string
        space_id:
          type: string
        top_k:
          type: integer
          minimum: 1
          maximum: 100
          default: 10

    RecallHit:
      type: object
      required: [memory, score]
      properties:
        memory:
          $ref: "#/components/schemas/MemoryItem"
        score:
          type: number

    RecallResponse:
      type: object
      required: [hits]
      properties:
        hits:
          type: array
          items:
            $ref: "#/components/schemas/RecallHit"

    DiaryEntry:
