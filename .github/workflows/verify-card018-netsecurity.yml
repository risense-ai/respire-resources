name: CARD-018 Windows NetSecurity preflight
on:
  pull_request:
    branches: [main]
    types: [labeled]
permissions:
  contents: read
concurrency:
  group: card018-netsecurity-preflight
  cancel-in-progress: false
jobs:
  verify-netsecurity:
    if: >-
      github.repository == 'risense-ai/respire-resources' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'verify/card-018-netsecurity-preflight' &&
      github.event.pull_request.draft == true &&
      github.event.label.name == 'card018-compiled-client2-proof' &&
      github.run_attempt == 1
    runs-on: windows-2025
    timeout-minutes: 6
    env:
      CARD018_FROZEN_HEAD: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: "${{ github.event.pull_request.head.sha }}"
          persist-credentials: false
      - name: Test exact address coverage and canonical readback parser
        shell: pwsh
        run: node --test test-cases/client2-e2e/netsecurity-preflight/offline-firewall-addresses.test.mjs
      - name: Install, verify and remove only disposable outbound block rules
        shell: pwsh
        run: ./test-cases/client2-e2e/netsecurity-preflight/verify-netsecurity.ps1
