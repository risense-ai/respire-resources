name: Verifier Verdict Gate

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created, edited]

permissions:
  contents: read
  issues: read
  pull-requests: read
  statuses: write

concurrency:
  group: verdict-gate-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  verdict-gate:
    name: verdict-gate
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request != null &&
       contains(github.event.comment.body, 'respire-verdict:'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout trusted governance scripts from main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Evaluate trusted Verifier verdict & publish commit status
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: |
          node process/scripts/respire-process.mjs verify-merge \
            "risense-ai/respire-resources#${PR_NUMBER}" \
            --verdict-only \
            --publish-status
