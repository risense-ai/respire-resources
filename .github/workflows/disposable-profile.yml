name: Disposable CARD-018 native profile qualification
on:
  pull_request:
    branches: [main]
    types: [labeled]
permissions:
  contents: read
  actions: read
jobs:
  qualify:
    if: github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'verify/card018-profile-admission' && github.event.label.name == 'card018-native-junction-proof' && github.run_attempt == 1
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: risense-ai/respire-resources
          ref: 1c060bcd958b5801f3c41a8542f98647d2a4b23e
          path: controls
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: 15091334381
          run-id: 45765454095
          github-token: ${{ github.token }}
          repository: risense-ai/respire-resources
          merge-multiple: true
          path: staged
      - name: Verify and run offline under the owned Windows job
        shell: pwsh
        env:
          MANIFEST_SHA: 9a05d9dd482ed7004b13fbdf45858d4bf39efbbe61c33fb77226e757386ad00d
        run: ./test-cases/disposable-profile/qualify.ps1
