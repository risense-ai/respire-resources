schema: openspec-v1
project: respire
ssot_repo: risense-ai/respire-resources

repositories:
  resources:
    name: risense-ai/respire-resources
    visibility: public
    role: OpenSpec specs, OpenAPI 3.1 + Core ABI contracts, HTML prototypes, E2E suites, governance
  monorepo:
    name: risense-ai/respire
    visibility: public
    role: Open-source Monorepo hosting apps/core, apps/runtime, apps/cli, apps/client2, and packages/runtime-sdk-*
  legacy_migration_sources:
    - risense-ai/respire-core
    - risense-ai/respire-runtime
    - risense-ai/respire-cli
    - risense-ai/respire-client2

rules:
  language: English only (CJK permitted strictly inside UI i18n files and i18n test fixtures)
  zero_cjk_gate: true
  max_doc_lines: 400
  max_code_lines: 600
  required_change_artifacts:
    - proposal.md
    - design.md
    - tasks.md
    - specs/*/spec.md
  delta_headings:
    - "## ADDED Requirements"
    - "## MODIFIED Requirements"
    - "## REMOVED Requirements"
  scenario_heading_prefix: "#### Scenario:"
  scenario_keywords:
    - GIVEN
    - WHEN
    - THEN
  capability_negotiation_only: true
  forbid_version_string_coupling: true
  forbid_line_number_anchors_in_docs: true
