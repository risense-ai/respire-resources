{
  "id": "E2E-001",
  "title": "Cold start exposes health and discovers capabilities",
  "mock": "empty",
  "steps": [
    {
      "name": "Discover OpenAPI and SSE from public health",
      "request": {
        "method": "GET",
        "path": "/v1/health",
        "public": true
      },
      "expect": {
        "status": 200,
        "equal": {
          "status": "ready"
        },
        "present": [
          "instance_id"
        ],
        "includes": {
          "capabilities": [
            "openapi.v1",
            "sse.operations.v1"
          ]
        }
      },
      "save": {
        "instance": "instance_id"
      }
    },
    {
      "name": "Instance stays stable while opening an empty workspace",
      "request": {
        "method": "GET",
        "path": "/v1/health",
        "public": true
      },
      "expect": {
        "status": 200,
        "equal": {
          "instance_id": "${instance}"
        },
        "present": [
          "active_space_id"
        ]
      },
      "save": {
        "space": "active_space_id"
      }
    },
    {
      "name": "Check empty workspace counts",
      "request": {
        "method": "GET",
        "path": "/v1/status/light"
      },
      "expect": {
        "status": 200,
        "equal": {
          "space_id": "${space}",
          "memory_count": 0,
          "diary_count": 0,
          "indexed_count": 0
        }
      }
    }
  ]
}
