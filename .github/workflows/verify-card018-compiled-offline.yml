name: CARD-018 offline compiled bilingual Client2
on:
  pull_request:
    branches: [main]
    types: [labeled]
permissions:
  contents: read
  actions: read
concurrency:
  group: card018-compiled-ui-offline
  cancel-in-progress: false
jobs:
  qualify:
    if: >-
      github.repository == 'risense-ai/respire-resources' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'verify/card-018-offline-recall-and-layout-evidence' &&
      github.event.pull_request.draft == true &&
      github.event.label.name == 'card018-compiled-client2-proof' &&
      github.run_attempt == 1
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      CARD018_FROZEN_HEAD: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: "${{ github.event.pull_request.head.sha }}"
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 1dc3b179f484c95a787f82ae5299fd562bc47f6a
          path: exact-fixtures
          persist-credentials: false
      - name: Stage the exact one-day artifact using GitHub-internal transfer
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: card018-offline-kit-windows-x64
          path: ${{ runner.temp }}/card018-kit-transfer
          github-token: ${{ github.token }}
          repository: risense-ai/respire-resources
          run-id: 45665923177
      - name: Verify kit, confirm effective block rules, run only synthetic loopback cases
        shell: pwsh
        run: ./test-cases/client2-e2e/offline-qualification/qualify-offline.ps1
